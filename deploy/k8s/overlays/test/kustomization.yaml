apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Test overlay. Apply with:
#   kubectl apply -k deploy/k8s/overlays/test/
#
# Tracks main-branch HEAD via a moving timestamp+sha tag that
# .github/workflows/flux-artifact.yml sets in the artifact Flux applies.
# Tag scheme is `<YYYYMMDDHHmmss>-sha-<short>`, so the newest sorts
# last. Image is pulled exactly once per tag (immutable).
#
# Hostname: test.typst-d2-mcp.stormlantern.nl
# DNS A record + GitHub OAuth callback URL are user-provisioned (see
# README → "Test environment").
namespace: typst-d2-mcp-test
resources:
  - ../../base
  # NO ../../dashboard here. "Ship the CR exactly once" was right; shipping
  # it from *test* was not. The dashboard covers prod as much as test — the
  # `namespace` template variable is what selects between them — so hanging
  # its lifecycle off this overlay meant suspending or decommissioning test
  # took production's dashboard with it, and left the CR sitting in
  # `typst-d2-mcp-test`, which reads as "prod has no dashboard".
  # It moved to overlays/prod/ (dlouwers/experiments#290).
  - sealed-secret.yaml
  # - sealed-ghcr-pull.yaml
# Overrides merged over the base generator, keeping the hashed name and
# therefore the automatic rollout on change.
configMapGenerator:
  - name: typst-d2-mcp-config
    behavior: merge
    envs:
      - config.env
patches:
  - path: ingress-patch.yaml
  # Same Longhorn migration as prod, against the test env's PV.
  - path: pvc-patch.yaml
# Set in the OCI artifact by .github/workflows/flux-artifact.yml to the
# newest `<YYYYMMDDHHmmss>-sha-<short>` tag in GHCR; nothing writes it
# back here. The value in git is only what was last committed, for a
# hand-run `kubectl apply -k`. The marker comment is the workflow's
# anchor — DO NOT remove or move it.
images:
  - name: ghcr.io/dlouwers/typst-d2-mcp
    newTag: 20261018201824-sha-aeba27d # {"flux-artifact": "test"}
