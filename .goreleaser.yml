version: 2

before:
  # No `go mod tidy`: the release builds the tagged commit as it is. If tidy
  # changed go.mod or go.sum, GoReleaser would stop on a dirty tree after the
  # image for the same tag had already gone to prod (#159). An untidy go.mod
  # fails the build loudly on its own.
  hooks:
    - go mod download

builds:
  - id: typst-d2-prep
    main: ./cmd/typst-d2-prep
    binary: typst-d2-prep
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: typst-d2-mcp
    main: ./cmd/typst-d2-mcp
    binary: typst-d2-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.serverVersion={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

# A tag like v2.1.0-rc.1 becomes a GitHub pre-release rather than "Latest".
# That is what makes an rc a safe end-to-end rehearsal (#159): the prod
# ImagePolicy only follows ^vX.Y.Z$, so an rc tag exercises the release,
# the tap token and the image build without moving prod.
release:
  prerelease: auto

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo

brews:
  - name: typst-d2-prep
    repository:
      owner: dlouwers
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/dlouwers/typst-d2-mcp"
    description: "Preprocessor for D2 diagrams in Typst documents"
    license: "MIT"
    dependencies:
      - name: d2
      - name: typst
    install: |
      bin.install "typst-d2-prep"
    test: |
      assert_match version.to_s, shell_output("#{bin}/typst-d2-prep version")

  - name: typst-d2-mcp
    repository:
      owner: dlouwers
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/dlouwers/typst-d2-mcp"
    description: "MCP server for AI-assisted Typst documentation with D2 diagrams"
    license: "MIT"
    dependencies:
      - name: d2
      - name: typst
    install: |
      bin.install "typst-d2-mcp"
    # Not `--help`: before #159 that was ignored and started a stdio server,
    # which hung `brew test` until its timeout.
    test: |
      assert_match version.to_s, shell_output("#{bin}/typst-d2-mcp version")
