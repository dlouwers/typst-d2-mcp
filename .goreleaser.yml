version: 2

before:
  # No `go mod tidy`: the release builds the tagged commit as it is. If tidy
  # changed go.mod or go.sum, GoReleaser would stop on a dirty tree after the
  # image for the same tag had already gone to prod (#159). An untidy go.mod
  # fails the build loudly on its own.
  hooks:
    - go mod download

builds:
  - id: typst-d2-prep
    main: ./cmd/typst-d2-prep
    binary: typst-d2-prep
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: typst-d2-mcp
    main: ./cmd/typst-d2-mcp
    binary: typst-d2-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.serverVersion={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

# A tag like v2.1.0-rc.1 becomes a GitHub pre-release rather than "Latest".
# That is what makes an rc a safe end-to-end rehearsal (#159): the prod
# ImagePolicy only follows ^vX.Y.Z$, so an rc tag exercises the release,
# the tap token and the image build without moving prod.
release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo

# Casks rather than formulae: GoReleaser deprecated `brews` in v2.10 (#162).
# Both casks install from the same per-platform archive, which holds both
# binaries; each links only its own.
#
# commit_author is the tap app's bot account, so the tap's history names
# what actually pushed rather than GoReleaser's default "goreleaserbot".
#
# The binaries are not notarized, so on macOS Gatekeeper would quarantine
# them. The post-install step clears that attribute on the staged files
# only. Signing and notarizing would be the proper fix; until then this is
# what makes `brew install` give a binary that runs.
homebrew_casks:
  - name: typst-d2-prep
    binaries: [typst-d2-prep]
    description: "Preprocessor for D2 diagrams in Typst documents"
    homepage: "https://github.com/dlouwers/typst-d2-mcp"
    license: "MIT"
    dependencies:
      - formula: d2
      - formula: typst
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/typst-d2-prep"]
          end
    commit_author:
      name: stormlantern-actions-write[bot]
      email: 318305978+stormlantern-actions-write[bot]@users.noreply.github.com
    repository:
      owner: stormlantern-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

  - name: typst-d2-mcp
    binaries: [typst-d2-mcp]
    description: "MCP server for AI-assisted Typst documentation with D2 diagrams"
    homepage: "https://github.com/dlouwers/typst-d2-mcp"
    license: "MIT"
    dependencies:
      - formula: d2
      - formula: typst
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/typst-d2-mcp"]
          end
    commit_author:
      name: stormlantern-actions-write[bot]
      email: 318305978+stormlantern-actions-write[bot]@users.noreply.github.com
    repository:
      owner: stormlantern-dev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
