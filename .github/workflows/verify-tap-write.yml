# Proves the Homebrew tap write path without cutting a release.
#
# The release workflow depends on four things that have never been
# exercised together: KMS signing the app's JWT through GitHub OIDC (the WIF
# provider admits this workflow only when dispatched on main), the app
# minting a token from it, its installation actually
# covering stormlantern-dev/homebrew-tap, and the branch ruleset on that repo
# letting the app bypass a protected main. If any of them is wrong, the
# release finds out *after* publishing artifacts, which is the expensive
# moment to fail.
#
# Run it from the Actions tab (workflow_dispatch). It pushes one empty
# commit to the tap's default branch — no files change, and the only
# trace is a line in that repo's history.
name: Verify tap write access

on:
  workflow_dispatch:

# The default token only reads this repository, for the local action; the
# app token does the writing. id-token is the OIDC token that gets this job
# permission to sign in KMS.
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the app to be configured
        env:
          TAP_APP_CLIENT_ID: ${{ vars.TAP_APP_CLIENT_ID }}
          TAP_WIF_PROVIDER: ${{ vars.TAP_WIF_PROVIDER }}
          TAP_KMS_KEY_VERSION: ${{ vars.TAP_KMS_KEY_VERSION }}
        run: |
          for v in TAP_APP_CLIENT_ID TAP_WIF_PROVIDER TAP_KMS_KEY_VERSION; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set — configure the app before running this"
              exit 1
            fi
          done

      # Only for ./.github/actions/tap-token, which a local `uses:` reads
      # from the workspace.
      - name: Check out the token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/tap-token
          persist-credentials: false

      - name: Mint a token for the Homebrew tap
        id: tap_token
        uses: ./.github/actions/tap-token
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          kms-key-version: ${{ vars.TAP_KMS_KEY_VERSION }}

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stormlantern-dev/homebrew-tap
          token: ${{ steps.tap_token.outputs.token }}
          path: tap

      # The push is the actual test: an empty commit still has to satisfy
      # the ruleset, so a missing or wrong bypass fails here exactly as it
      # would during a release.
      - name: Push an empty commit to the protected branch
        working-directory: tap
        run: |
          git config user.name "stormlantern-actions-write[bot]"
          git config user.email "stormlantern-actions-write[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: verify app write access (run ${GITHUB_RUN_ID})"
          git push

      - name: Report
        run: |
          echo "### Tap write access verified :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- KMS signed the app JWT through GitHub OIDC" >> "$GITHUB_STEP_SUMMARY"
          echo "- app minted a token for \`stormlantern-dev/homebrew-tap\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- its installation covers that repository" >> "$GITHUB_STEP_SUMMARY"
          echo "- the branch ruleset let it push to a protected \`main\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke the tap token
        if: always() && steps.tap_token.outputs.token != ''
        env:
          TOKEN: ${{ steps.tap_token.outputs.token }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" https://api.github.com/installation/token
