name: Image

on:
  push:
    branches: [main]
    # No `tags: v*` here. A release image is built by release.yml, after
    # GoReleaser has succeeded (see workflow_call below).
    #
    # An overlay-only commit changes no code, so it needs no new image.
    # This was the loop guard while Flux's image-automation-controller
    # committed tag bumps here; since dlouwers/experiments#509 the tags
    # are set in the OCI artifact by flux-artifact.yml instead.
    paths-ignore:
      - 'deploy/k8s/overlays/test/kustomization.yaml'
      - 'deploy/k8s/overlays/prod/kustomization.yaml'
  # Manual trigger — `gh workflow run Image`. Useful when the push
  # trigger is missed or to re-publish without a new commit.
  workflow_dispatch: {}
  # Called by release.yml on a v* tag, once GoReleaser has published the
  # GitHub release and the tap formulae. The prod ImagePolicy in experiments
  # follows ^vX.Y.Z$ image tags, so pushing that tag IS the prod deploy.
  # Building it from its own tag trigger raced the release: a failed
  # GoReleaser still left prod on the new version, with no release and no
  # formula behind it (#159). `github.ref` here is the caller's tag ref, so
  # the semver tags below come out the same.
  workflow_call: {}

# Avoid two concurrent builds on the same ref racing for the same
# image tag — the second would push and overwrite mid-flight.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write  # the design system from Artifact Registry, through WIF
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute timestamp-prefixed sha tag for Flux ImagePolicy
        # Flux's ImagePolicy can sort `numerical` on a regex-extracted
        # part of the tag, but cannot read the manifest's `created`
        # timestamp. Embedding a timestamp prefix in the tag is the
        # canonical workaround. The ImagePolicy in the experiments
        # repo matches `^(?P<ts>\d{14})-sha-[a-f0-9]+$` and sorts
        # highest-first.
        id: ts_tag
        run: |
          echo "value=$(date -u +%Y%m%d%H%M%S)-sha-$(git rev-parse --short=7 ${{ github.sha }})" >> "$GITHUB_OUTPUT"

      - name: Compute build-info build-args
        # Short SHA + RFC 3339 build time get baked into the binary
        # via ldflags so operators can correlate a running container
        # to a specific commit.
        id: build_info
        run: |
          echo "git_sha=$(git rev-parse --short=7 ${{ github.sha }})" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.ts_tag.outputs.value }},enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Same read-only access as CI. The image build does not see this job's
      # environment, so the action's .netrc goes to BuildKit as a secret.
      - name: Authenticate to the design system
        id: ds_auth
        uses: ./.github/actions/design-system-auth

      - name: Build & push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # The build resolves a private Go module; see the Dockerfile.
          # BuildKit keeps this out of the image layers and out of the
          # build cache exported to GHA.
          secret-files: |
            go_netrc=${{ steps.ds_auth.outputs.netrc }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.build_info.outputs.git_sha }}
            BUILD_TIME=${{ steps.build_info.outputs.build_time }}
