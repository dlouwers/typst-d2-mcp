name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write  # OIDC → WIF: the tap App's JWT in KMS, and the design system in GAR
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must be at least go.mod's directive. With 1.23 here (against
          # 1.25.5) the build still worked, but only because the go command
          # silently downloaded the newer toolchain on every run — slower,
          # and it hid the mismatch.
          go-version: '1.26'
          cache: true

      # Before GoReleaser: its `go mod download` hook and every build resolve
      # the private design-system module (#82). ci.yml and image.yml had this
      # step; this workflow did not, so the first release after #82 would
      # have failed here while image.yml still pushed the tag to prod (#159).
      #
      # No fork guard as in ci.yml: a tag push is never from a fork, and a
      # release without the module cannot build anyway. The action points
      # GOPROXY at Artifact Registry, through WIF; it touches nothing git
      # does, so GoReleaser's release and tap steps are unaffected.
      - name: Authenticate to the design system
        uses: ./.github/actions/design-system-auth

      # Writing the Homebrew formulae is machine access to another repo, so
      # it goes through a GitHub App rather than a personal token: minted
      # per run, expiring in about an hour, owned by the account rather
      # than by a person whose access it would otherwise inherit. The app is
      # installed on stormlantern-dev/homebrew-tap alone, with Contents: write and
      # nothing else.
      #
      # Separate from the read app on purpose — App permissions apply to
      # every repo in an installation, so a shared app would silently give
      # the design-system repo write access.
      #
      # Its private key lives in Cloud KMS, not in a secret: this job signs
      # the App JWT there through GitHub OIDC (dlouwers/experiments#505). The
      # WIF provider admits this workflow only on a v* tag push.
      - name: Mint a token for the Homebrew tap
        id: tap_token
        uses: ./.github/actions/tap-token
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          workload-identity-provider: ${{ vars.TAP_WIF_PROVIDER }}
          kms-key-version: ${{ vars.TAP_KMS_KEY_VERSION }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # A major pin, not `latest`: GoReleaser removes deprecated options
          # only in a major release, so v3 could break a config that works
          # today on the first tag after it ships (#162).
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap_token.outputs.token }}
          # Release the tag that triggered this run. Left to itself,
          # GoReleaser derives the version from git, and when two tags sit
          # on one commit it can pick the other one: v2.1.0 on the commit
          # rehearsed as v2.1.0-rc.1 tried to re-upload to the rc release
          # and failed on "already_exists" (#159).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      # The action has no post step, so the token is revoked here rather
      # than left to expire.
      - name: Revoke the tap token
        if: always() && steps.tap_token.outputs.token != ''
        env:
          TOKEN: ${{ steps.tap_token.outputs.token }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" https://api.github.com/installation/token

  # The release image, and with it the prod deploy: Flux moves prod to any
  # new ^vX.Y.Z$ image tag. It waits for GoReleaser so prod can never run a
  # version that has no GitHub release or Homebrew formula (#159). If the
  # image build fails instead, "Re-run failed jobs" retries just this job.
  image:
    needs: goreleaser
    permissions:
      contents: read
      packages: write
      id-token: write  # the design system in GAR, see image.yml
    uses: ./.github/workflows/image.yml

  # Installs what was just published from the tap, on macOS and Linux. Not a
  # gate for `image` on purpose: see brew-smoke.yml.
  brew:
    needs: goreleaser
    permissions: {}
    uses: ./.github/workflows/brew-smoke.yml
    with:
      version: ${{ github.ref_name }}
