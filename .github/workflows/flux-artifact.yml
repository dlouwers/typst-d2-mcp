# Publishes deploy/k8s as an OCI artifact in Google Artifact Registry, which
# is where Flux reads this repository's manifests from (dlouwers/experiments
# #509). The artifact also decides which image test and prod run: nothing
# writes image tags back to git, so this works with main protected.
#
# Every run takes main's HEAD and the image tags in GHCR at that moment:
#   - test: the newest `<YYYYMMDDHHmmss>-sha-<short>` tag, which image.yml
#     pushes for every build of main;
#   - prod: the highest `vX.Y.Z` tag, which release.yml pushes only after
#     GoReleaser has published the release and the formulae (#159).
# That is the selection Flux's ImagePolicies made before. The two `newTag:`
# lines in git are overwritten in the artifact, and keep only whatever value
# was last committed, as a fallback for `kubectl apply -k` by hand.
#
# It runs on every push to main (a manifest change), after every successful
# Image or Release run (a new tag), and by hand. Runs queue rather than
# cancel, and each one reads HEAD and the registry when it starts, so the
# last run to finish always carries the newest state of both.
#
# No secret. The job proves who it is through GitHub OIDC → Workload Identity
# Federation: the `github-flux-oci` provider for this repository admits only
# this file, on main (scripts/gcp-flux-oci.nu in dlouwers/experiments), and
# only this repository's CI may write to flux-typst-d2-mcp. A rename of this
# file stops deploys until the provider is updated, deliberately: this file
# decides what Flux applies.
name: flux-artifact

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Image, Release]
    types: [completed]
  workflow_dispatch: {}

# Never cancel, so a queued run always follows the one in flight. GitHub
# keeps at most one pending run per group, always the newest, which is fine
# because a run's inputs are read when it starts, not when it was queued.
concurrency:
  group: flux-artifact
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  push:
    # A failed build has no new tag to deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT: oci://europe-west4-docker.pkg.dev/homelab-495021/flux-typst-d2-mcp/manifests
      WIF_PROVIDER: projects/356863323226/locations/global/workloadIdentityPools/github-flux-oci/providers/typst-d2-mcp
      IMAGE: dlouwers/typst-d2-mcp
    steps:
      # main, not github.sha: a workflow_run carries the sha of the run that
      # triggered it, and the artifact must hold the newest manifests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Pick the image tags
        id: tags
        run: |
          set -euo pipefail
          token=$(curl -sfS "https://ghcr.io/token?scope=repository:${IMAGE}:pull" | jq -r .token)
          url="https://ghcr.io/v2/${IMAGE}/tags/list?n=1000"
          : > tags.txt
          while [ -n "$url" ]; do
            curl -sfS -D headers.txt -H "Authorization: Bearer ${token}" "$url" | jq -r '.tags[]' >> tags.txt
            next=$(grep -i '^link:' headers.txt | sed -E 's/^[Ll]ink: *<([^>]*)>.*/\1/' | tr -d '\r' || true)
            url=${next:+https://ghcr.io${next}}
          done
          test_tag=$(grep -E '^[0-9]{14}-sha-[a-f0-9]+$' tags.txt | sort | tail -n 1)
          prod_tag=$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' tags.txt | sort -V | tail -n 1)
          if [ -z "$test_tag" ] || [ -z "$prod_tag" ]; then
            echo "::error::no test or prod tag in GHCR (test='${test_tag}', prod='${prod_tag}')"
            exit 1
          fi
          rm -f tags.txt headers.txt
          echo "test=${test_tag}" >> "$GITHUB_OUTPUT"
          echo "prod=${prod_tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set the tags in the overlays
        env:
          TEST_TAG: ${{ steps.tags.outputs.test }}
          PROD_TAG: ${{ steps.tags.outputs.prod }}
        run: |
          set -euo pipefail
          for env in test prod; do
            file="deploy/k8s/overlays/${env}/kustomization.yaml"
            tag=TEST_TAG; [ "$env" = prod ] && tag=PROD_TAG
            marker="# {\"flux-artifact\": \"${env}\"}"
            grep -qF "$marker" "$file" || { echo "::error::${file} lost its ${marker} marker"; exit 1; }
            sed -i -E "s|newTag: [^ ]+ (# \{\"flux-artifact\": \"${env}\"\})|newTag: ${!tag} \1|" "$file"
            grep -F "$marker" "$file"
          done

      # The cluster runs Flux 2.8.6; the CLI matches it.
      - uses: fluxcd/flux2/action@04acaec6161ac4fb1a82ffafa88901c03271d34f # v2.8.6
        with:
          version: 2.8.6

      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          create_credentials_file: false

      # One artifact tag per run, since one commit can now be published with
      # several image tags. A rollback is `flux tag artifact <that> --tag main`.
      - name: Push and tag the artifact
        env:
          TOKEN: ${{ steps.gcp.outputs.auth_token }}
          SHA: ${{ steps.tags.outputs.sha }}
          TEST_TAG: ${{ steps.tags.outputs.test }}
          PROD_TAG: ${{ steps.tags.outputs.prod }}
        run: |
          set -euo pipefail
          creds="oauth2accesstoken:${TOKEN}"
          ref="${ARTIFACT}:sha-${SHA}-run-${GITHUB_RUN_ID}"
          flux push artifact "$ref" \
            --path ./deploy/k8s \
            --source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision "main@sha1:${SHA}" \
            --annotations "nl.stormlantern.image.test=${TEST_TAG}" \
            --annotations "nl.stormlantern.image.prod=${PROD_TAG}" \
            --creds "$creds"
          flux tag artifact "$ref" --tag main --creds "$creds"
          {
            echo "### Flux artifact pushed"
            echo ""
            echo "- \`${ref}\`, tagged \`main\`"
            echo "- revision \`main@sha1:${SHA}\`"
            echo "- test runs \`${TEST_TAG}\`, prod runs \`${PROD_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
