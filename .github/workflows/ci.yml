name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C /usr/local/bin --strip-components=1

      - name: Download dependencies
        run: go mod download

      # The Stormlantern assets under internal/web/static/vendor/ are
      # committed so the image build stays toolchain-free. This catches a
      # forgotten re-sync after the design system changes. Inert until a
      # DESIGN_SYSTEM_TOKEN secret exists with read access to that repo.
      - name: Check out design system
        if: env.DS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: dlouwers/stormlantern-design-system
          token: ${{ env.DS_TOKEN }}
          path: .design-system
        env:
          DS_TOKEN: ${{ secrets.DESIGN_SYSTEM_TOKEN }}

      - name: Check vendored assets are in sync
        if: env.DS_TOKEN != ''
        env:
          DS_TOKEN: ${{ secrets.DESIGN_SYSTEM_TOKEN }}
          STORMLANTERN_DS: .design-system
        run: |
          ./scripts/sync-vendor.sh
          git diff --exit-code -- internal/web/static/vendor \
            || { echo "::error::vendored design-system assets are stale; run scripts/sync-vendor.sh"; exit 1; }

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Build typst-d2-prep
        run: go build -v ./cmd/typst-d2-prep

      - name: Build typst-d2-mcp
        run: go build -v ./cmd/typst-d2-mcp

      - name: Lint
        # The action's default install-mode downloads a pre-built
        # binary that ships with Go 1.24 and refuses to lint a Go-1.25
        # module. `goinstall` recompiles the linter with the runner's
        # toolchain (set above to 1.25), avoiding the version mismatch.
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: latest
          install-mode: goinstall
