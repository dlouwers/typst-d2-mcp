name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: a PR opened against another branch (a stacked
  # PR, say) must still be checked. With the filter, PRs #43 and #44 got
  # no CI at all, and merged unverified. Retargeting a PR to main does
  # not help either — that fires `edited`, which is not in the default
  # trigger set.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: the design system comes from Artifact Registry through
    # Workload Identity Federation (dlouwers/experiments#526).
    permissions:
      contents: read
      id-token: write
    env:
      # The design-system step needs a GitHub OIDC token, and GitHub issues
      # none to a pull request from a fork. Such a run cannot resolve the
      # private module either way; skip the step rather than fail on it.
      CAN_FETCH_DS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      # Pinned, and fetched straight from the release tarball. The
      # install script resolves "latest" through the unauthenticated
      # GitHub API, which is rate-limited on shared runners — it failed
      # three times and gave up on a PR run. It also meant CI tested a
      # d2 the image does not ship, silently, the moment the two drift.
      # Keep this version in step with Dockerfile's D2_VERSION and
      # .devcontainer/post-create.sh.
      - name: Install D2
        timeout-minutes: 3
        env:
          D2_VERSION: v0.7.1
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp --strip-components=2 "d2-${D2_VERSION}/bin/d2"
          sudo install -m 0755 /tmp/d2 /usr/local/bin/d2
          d2 --version

      - name: Install Typst
        timeout-minutes: 3
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C /usr/local/bin --strip-components=1

      # Before ANY go command: `go mod download` below, and the build that
      # playwright's webServer shells out to, both resolve the private
      # design-system module. See .github/actions/design-system-auth.
      #
      # Skipped on a fork PR, which gets no OIDC token; since #80 such a run
      # cannot build, rather than merely skipping a check. Dependabot runs
      # get one like any other run of this repository.
      - name: Authenticate to the design system
        if: env.CAN_FETCH_DS == 'true'
        uses: ./.github/actions/design-system-auth

      - name: Download dependencies
        timeout-minutes: 5
        run: go mod download

      # The Stormlantern assets under internal/web/static/vendor/ are
      # committed so the image build stays toolchain-free. This catches a
      # forgotten re-sync after the design system changes.
      #
      - name: Run go vet
        timeout-minutes: 5
        run: go vet ./...

      - name: Run tests
        timeout-minutes: 10
        run: go test -v ./...

      - name: Build typst-d2-prep
        timeout-minutes: 5
        run: go build -v ./cmd/typst-d2-prep

      - name: Build typst-d2-mcp
        timeout-minutes: 5
        run: go build -v ./cmd/typst-d2-mcp

      - name: Lint
        timeout-minutes: 10
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  # Browser-level checks for the admin UI: the things a Go test cannot
  # reach. Chief among them is SameSite cookie behaviour — the only CSRF
  # defence the admin actions have, and enforced by the browser alone.
  # Separate job so a browser flake doesn't gate Go-test feedback.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CAN_FETCH_DS: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      # Before ANY go command: `go mod download` below, and the build that
      # playwright's webServer shells out to, both resolve the private
      # design-system module. See .github/actions/design-system-auth.
      #
      # Skipped on a fork PR, which gets no OIDC token; since #80 such a run
      # cannot build, rather than merely skipping a check. Dependabot runs
      # get one like any other run of this repository.
      - name: Authenticate to the design system
        if: env.CAN_FETCH_DS == 'true'
        uses: ./.github/actions/design-system-auth

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Playwright deps
        timeout-minutes: 3
        working-directory: playwright
        run: bun install --frozen-lockfile

      # Cache the Chromium download between runs, keyed on the lockfile
      # so it invalidates when @playwright/test is bumped.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright/bun.lock') }}

      - name: Install Chromium + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: playwright
        run: bunx playwright install --with-deps chromium

      # No apt step on a cache hit. `playwright install-deps` took 2m28s on
      # a job whose tests take 14s, and twice hung past 15 minutes — and
      # the ubuntu-latest image already ships the libraries Chromium
      # needs. If one ever is missing the browser fails to launch, which
      # is loud and immediate rather than subtle.

      # playwright.config.ts starts the server itself via
      # scripts/e2e-server.sh, which builds the binary with the Go
      # toolchain set up above.
      - name: Run Playwright tests
        timeout-minutes: 5
        working-directory: playwright
        run: bunx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 7
