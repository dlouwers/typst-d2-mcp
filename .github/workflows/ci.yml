name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: a PR opened against another branch (a stacked
  # PR, say) must still be checked. With the filter, PRs #43 and #44 got
  # no CI at all, and merged unverified. Retargeting a PR to main does
  # not help either — that fires `edited`, which is not in the default
  # trigger set.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The design-system steps need the GitHub App private key, which lives
      # only in the regular Actions secret store. Dependabot runs (and fork
      # PRs) get an *empty* `secrets` context — yet `vars` still resolve there,
      # so guarding on `vars.DS_APP_CLIENT_ID != ''` alone lets the token-mint
      # step run and then fail hard with "private-key must be non-empty",
      # taking the whole job red. Gate on the key itself: absent key ⇒ the DS
      # steps stay inert. Referencing an absent secret yields "" (no error), so
      # this is safe to evaluate in every context. `secrets` is not usable in an
      # `if:`, but reading it into a job-level env var and testing that is the
      # documented workaround.
      HAS_DS_KEY: ${{ secrets.DS_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install D2
        timeout-minutes: 3
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Install Typst
        timeout-minutes: 3
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C /usr/local/bin --strip-components=1

      - name: Download dependencies
        timeout-minutes: 5
        run: go mod download

      # The Stormlantern assets under internal/web/static/vendor/ are
      # committed so the image build stays toolchain-free. This catches a
      # forgotten re-sync after the design system changes.
      #
      # Access is via a GitHub App rather than a PAT: the token is minted
      # per run and expires in an hour, it is owned by the account rather
      # than by a person whose access it would otherwise inherit, and
      # there is no annual expiry to renew by hand. The app id is a repo
      # variable (it is not secret); only the private key is a secret.
      #
      # All three steps stay inert unless DS_APP_PRIVATE_KEY is available (see
      # HAS_DS_KEY above), so a Dependabot run, a fork PR, or a fresh clone
      # builds without them rather than failing on the missing key.
      - name: Mint a token for the design system
        id: ds_token
        if: env.HAS_DS_KEY == 'true'
        timeout-minutes: 2
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DS_APP_PRIVATE_KEY }}
          owner: dlouwers
          repositories: stormlantern-design-system

      - name: Check out design system
        if: env.HAS_DS_KEY == 'true'
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dlouwers/stormlantern-design-system
          token: ${{ steps.ds_token.outputs.token }}
          path: .design-system
          persist-credentials: false

      - name: Check vendored assets are in sync
        if: env.HAS_DS_KEY == 'true'
        timeout-minutes: 2
        env:
          STORMLANTERN_DS: .design-system
        run: |
          ./scripts/sync-vendor.sh
          git diff --exit-code -- internal/web/static/vendor \
            || { echo "::error::vendored design-system assets are stale; run scripts/sync-vendor.sh"; exit 1; }

      - name: Run go vet
        timeout-minutes: 5
        run: go vet ./...

      - name: Run tests
        timeout-minutes: 10
        run: go test -v ./...

      - name: Build typst-d2-prep
        timeout-minutes: 5
        run: go build -v ./cmd/typst-d2-prep

      - name: Build typst-d2-mcp
        timeout-minutes: 5
        run: go build -v ./cmd/typst-d2-mcp

      - name: Lint
        timeout-minutes: 10
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  # Browser-level checks for the admin UI: the things a Go test cannot
  # reach. Chief among them is SameSite cookie behaviour — the only CSRF
  # defence the admin actions have, and enforced by the browser alone.
  # Separate job so a browser flake doesn't gate Go-test feedback.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Playwright deps
        timeout-minutes: 3
        working-directory: playwright
        run: bun install --frozen-lockfile

      # Cache the Chromium download between runs, keyed on the lockfile
      # so it invalidates when @playwright/test is bumped.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright/bun.lock') }}

      - name: Install Chromium + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 8
        working-directory: playwright
        run: bunx playwright install --with-deps chromium

      # No apt step on a cache hit. `playwright install-deps` took 2m28s on
      # a job whose tests take 14s, and twice hung past 15 minutes — and
      # the ubuntu-latest image already ships the libraries Chromium
      # needs. If one ever is missing the browser fails to launch, which
      # is loud and immediate rather than subtle.

      # playwright.config.ts starts the server itself via
      # scripts/e2e-server.sh, which builds the binary with the Go
      # toolchain set up above.
      - name: Run Playwright tests
        timeout-minutes: 5
        working-directory: playwright
        run: bunx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 7
