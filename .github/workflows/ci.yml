name: CI

on:
  push:
    branches: [main]
  # No `branches` filter: a PR opened against another branch (a stacked
  # PR, say) must still be checked. With the filter, PRs #43 and #44 got
  # no CI at all, and merged unverified. Retargeting a PR to main does
  # not help either — that fires `edited`, which is not in the default
  # trigger set.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ -C /usr/local/bin --strip-components=1

      - name: Download dependencies
        run: go mod download

      # The Stormlantern assets under internal/web/static/vendor/ are
      # committed so the image build stays toolchain-free. This catches a
      # forgotten re-sync after the design system changes.
      #
      # Access is via a GitHub App rather than a PAT: the token is minted
      # per run and expires in an hour, it is owned by the account rather
      # than by a person whose access it would otherwise inherit, and
      # there is no annual expiry to renew by hand. The app id is a repo
      # variable (it is not secret); only the private key is a secret.
      #
      # All three steps stay inert until DS_APP_ID is set, so a fork or a
      # fresh clone builds without them rather than failing.
      - name: Mint a token for the design system
        id: ds_token
        if: vars.DS_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DS_APP_ID }}
          private-key: ${{ secrets.DS_APP_PRIVATE_KEY }}
          owner: dlouwers
          repositories: stormlantern-design-system

      - name: Check out design system
        if: vars.DS_APP_ID != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dlouwers/stormlantern-design-system
          token: ${{ steps.ds_token.outputs.token }}
          path: .design-system
          persist-credentials: false

      - name: Check vendored assets are in sync
        if: vars.DS_APP_ID != ''
        env:
          STORMLANTERN_DS: .design-system
        run: |
          ./scripts/sync-vendor.sh
          git diff --exit-code -- internal/web/static/vendor \
            || { echo "::error::vendored design-system assets are stale; run scripts/sync-vendor.sh"; exit 1; }

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v ./...

      - name: Build typst-d2-prep
        run: go build -v ./cmd/typst-d2-prep

      - name: Build typst-d2-mcp
        run: go build -v ./cmd/typst-d2-mcp

      - name: Lint
        # The action's default install-mode downloads a pre-built
        # binary that ships with Go 1.24 and refuses to lint a Go-1.25
        # module. `goinstall` recompiles the linter with the runner's
        # toolchain (set above to 1.25), avoiding the version mismatch.
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          version: latest
          install-mode: goinstall

  # Browser-level checks for the admin UI: the things a Go test cannot
  # reach. Chief among them is SameSite cookie behaviour — the only CSRF
  # defence the admin actions have, and enforced by the browser alone.
  # Separate job so a browser flake doesn't gate Go-test feedback.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Playwright deps
        working-directory: playwright
        run: bun install --frozen-lockfile

      # Cache the Chromium download between runs, keyed on the lockfile
      # so it invalidates when @playwright/test is bumped.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright/bun.lock') }}

      - name: Install Chromium + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: playwright
        run: bunx playwright install --with-deps chromium

      # No apt step on a cache hit. `playwright install-deps` took 2m28s on
      # a job whose tests take 14s, and twice hung past 15 minutes — and
      # the ubuntu-latest image already ships the libraries Chromium
      # needs. If one ever is missing the browser fails to launch, which
      # is loud and immediate rather than subtle.

      # playwright.config.ts starts the server itself via
      # scripts/e2e-server.sh, which builds the binary with the Go
      # toolchain set up above.
      - name: Run Playwright tests
        working-directory: playwright
        run: bunx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright/playwright-report
          retention-days: 7
