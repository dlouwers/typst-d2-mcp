# Every `uses:` in .github/workflows/ is pinned to a full commit SHA rather
# than a tag, because a tag is a mutable pointer its owner can move — which is
# how tj-actions/changed-files leaked secrets from thousands of repositories in
# March 2025. See dlouwers/experiments#301.
#
# This file is what stops that from becoming slow rot. Dependabot's
# github-actions ecosystem understands SHA pins and rewrites the SHA and the
# trailing version comment together; without it, a SHA pin is a pin that never
# moves again, which is a different way of running old code.
#
# `directory: "/"` is correct and is not a stand-in for "/.github/workflows":
# the ecosystem is anchored at the repository root and locates the workflow
# directory itself. Pointing it at the literal workflow path is the classic way
# to end up with a config Dependabot accepts and then never opens a PR from.
#
# This also covers the `uses:` in manifests.yml pointing at
# dlouwers/ci-workflows — a called reusable workflow is third-party code in
# this repository's context just as much as an action is, and the same
# reasoning about mutable refs applies to it.
version: 2
# The private design-system module, from Google Artifact Registry
# (dlouwers/experiments#526). Dependabot's proxy exchanges its GitHub OIDC
# token at the github-go-modules/typst-d2-mcp provider, then impersonates
# go-modules-reader: a direct federated token is refused for expiring too soon
# (dependabot/proxy#262). Drop `service-account` once dependabot/proxy#328 is
# live. GOPROXY and GONOSUMDB for the update itself are in go.env. No secret.
registries:
  go-stormlantern:
    type: goproxy-server
    url: https://europe-west4-go.pkg.dev/homelab-495021/go-stormlantern
    workload-identity-provider: projects/356863323226/locations/global/workloadIdentityPools/github-go-modules/providers/typst-d2-mcp
    service-account: go-modules-reader@homelab-495021.iam.gserviceaccount.com

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"

  # The composite action in .github/actions/ pins its own `uses:` by SHA and
  # is NOT covered by the entry above: for the github-actions ecosystem,
  # `directory: "/"` finds .github/workflows, not nested action.yml files.
  # Each composite action needs its own directory entry, or its pin becomes
  # the frozen-forever kind this file exists to prevent.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/design-system-auth"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
  # playwright/package.json is the only npm manifest in this repo and had no
  # ecosystem watching it at all: @playwright/test has been pinned at 1.49.1
  # while 1.62.1 shipped, with no PR ever opened. The sibling repo had the
  # same hole for a different reason — its npm entry pointed at a different
  # manifest — and the effect was identical (#85).
  #
  # Note what this still does NOT cover: internal/web/static/vendor/htmx.min.js
  # is vendored by hand and appears in no manifest, so Dependabot cannot see
  # it and never could. That gap is closed by vendorpins.json plus the weekly
  # registry check, not here.
  #
  # "bun", not "npm": the lockfile is playwright/bun.lock and CI installs
  # with `bun install --frozen-lockfile`. The npm ecosystem bumped
  # package.json but left bun.lock alone, so every PR it opened failed
  # the frozen install (#154).
  - package-ecosystem: "bun"
    directory: "/playwright"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: weekly
    registries:
      - go-stormlantern
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
