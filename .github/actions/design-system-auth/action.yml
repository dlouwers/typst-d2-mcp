name: Fetch the design system from Artifact Registry
description: >
  Point the Go toolchain at the Go repository in Google Artifact Registry that
  serves the private module github.com/dlouwers/stormlantern-design-system,
  authenticated through Workload Identity Federation, so `go mod download`
  can fetch it. No secret is involved.

# Factored out of ci.yml because the build, playwright, image and release jobs
# all need it, and every Go command in them depends on it having run. Two
# copies of these steps is two things to keep in step, and a copy that
# silently falls behind is what made this repo serve a stale design system
# for a day (#80).
#
# ---------------------------------------------------------------------------
# How it works (dlouwers/experiments#526)
# ---------------------------------------------------------------------------
#
# The design-system repository uploads every vX.Y.Z to the GAR Go repository
# go-stormlantern (its go-module.yml). This job proves who it is through
# GitHub OIDC: the `typst-d2-mcp` provider in the `github-go-modules` pool
# admits this repository's workflows, and the repository may read
# go-stormlantern (scripts/gcp-go-modules.nu in dlouwers/experiments).
#
# The Go toolchain then needs three things, set here for every later step:
#   - GOPROXY with GAR first, then the public proxy for everything else;
#   - GONOSUMDB for the module, which is not in the public checksum database
#     (go.sum still pins its hash, so nothing is trusted blindly);
#   - a .netrc with the token for the GAR host, via NETRC.
# GOPRIVATE is cleared: it would send the module past every proxy, straight
# to github.com, which is the path that needed a key.
#
# Before this, a GitHub App key (DS_APP_PRIVATE_KEY, stormlantern-actions-read)
# minted an installation token per run, kept in both the Actions and the
# Dependabot secret store.
#
# Needs `id-token: write` on the job. A pull request from a fork gets no OIDC
# token, so callers skip this there; such a run cannot resolve the module and
# was never able to.

outputs:
  netrc:
    description: >
      Path to the .netrc this wrote. For the container build, which runs
      `go mod download` where this job's environment does not reach: pass the
      file to BuildKit as the go_netrc secret, which mounts it for one RUN and
      never writes it to a layer.
    value: ${{ steps.netrc.outputs.path }}

runs:
  using: composite
  steps:
    - name: Authenticate to Google Cloud
      id: gcp
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: projects/356863323226/locations/global/workloadIdentityPools/github-go-modules/providers/typst-d2-mcp
        create_credentials_file: false

    - name: Point the Go toolchain at it
      id: netrc
      shell: bash
      env:
        TOKEN: ${{ steps.gcp.outputs.auth_token }}
      run: |
        set -euo pipefail
        netrc="${RUNNER_TEMP}/design-system.netrc"
        printf 'machine europe-west4-go.pkg.dev login oauth2accesstoken password %s\n' "$TOKEN" > "$netrc"
        chmod 600 "$netrc"
        {
          echo "NETRC=${netrc}"
          echo "GOPROXY=https://europe-west4-go.pkg.dev/homelab-495021/go-stormlantern,https://proxy.golang.org,direct"
          echo "GONOSUMDB=github.com/dlouwers/stormlantern-design-system"
          echo "GOPRIVATE="
        } >> "$GITHUB_ENV"
        echo "path=${netrc}" >> "$GITHUB_OUTPUT"
